bio:
  # en: Türkçe metinden çevrildi (kullanıcı gözden geçirmeli)
  en: |-
    I'm a second-year Digital Game Design student at Muğla Sıtkı Koçman University. I started 3D modeling in Blender in 2020 and have been actively creating models for the past two years. Since I can also build game systems in Unity with C#, I keep in mind how my models will work inside a game. I'm currently improving my animation skills.
