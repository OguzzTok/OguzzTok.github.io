    Muğla Sıtkı Koçman Üniversitesi Dijital Oyun Tasarımı 2. sınıf öğrencisiyim. 2020'de Blender ile 3D modellemeye başladım; son 2 yıldır aktif olarak model üretiyorum. Unity'de C# ile oyun sistemleri geliştirebildiğim için modellerimin oyun içinde nasıl çalışacağını da göz önünde bulunduruyorum. Şu anda animasyon becerilerimi geliştiriyorum.
